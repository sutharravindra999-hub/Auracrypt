<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Crypt - Biometric & Dual Language Voice Authentication</title>
    <style>
        body {
            background-color: #0b131b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            margin: auto;
            background: #121e2b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        select {
            background: #1e293b;
            color: white;
        }
        .btn-audio {
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-audio:hover {
            background-color: #0369a1;
        }
        video {
            width: 100%;
            border-radius: 5px;
            margin-top: 10px;
        }
        #auth-instruction {
            margin-top: 15px;
            color: #facc15;
            font-weight: bold;
            font-size: 15px;
            line-height: 1.5;
        }
        #ledger-status {
            margin-top: 10px;
            font-size: 13px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Aura Crypt Security</h2>
        
        <label for="cameraSelect">कैमरा चुनें (Mobile/Desktop/IR):</label>
        <select id="cameraSelect">
            <!-- कैमरे के विकल्प यहाँ लोड होंगे -->
        </select>

        <video id="videoElement" autoplay playsinline></video>

        <!-- वॉइस ऑथेंटिकेशन बटन -->
        <button onclick="startVoiceAuthentication()" class="btn-audio">वॉइस ऑथेंटिकेशन शुरू करें</button>

        <!-- निर्देश और हिंदी/इंग्लिश दोनों में देवता का नाम -->
        <p id="auth-instruction">Listening... Please speak the deity name shown below / कृपया नीचे दिया गया नाम बोलें...</p>
        <p id="ledger-status"></p>
    </div>

    <script>
        // सनातन धर्म के सभी प्रमुख देवी-देवताओं की सूची (हिंदी और अंग्रेजी दोनों फॉर्मेट में)
        const deities = [
            { hi: "गणेश", en: "Ganesh" },
            { hi: "शिव", en: "Shiva" },
            { hi: "विष्णु", en: "Vishnu" },
            { hi: "ब्रह्मा", en: "Brahma" },
            { hi: "राम", en: "Ram" },
            { hi: "कृष्ण", en: "Krishna" },
            { hi: "हनुमान", en: "Hanuman" },
            { hi: "सूर्य", en: "Surya" },
            { hi: "चंद्र", en: "Chandra" },
            { hi: "अग्नि", en: "Agni" },
            { hi: "वायु", en: "Vayu" },
            { hi: "इंद्र", en: "Indra" },
            { hi: "वरुण", en: "Varun" },
            { hi: "कुबेर", en: "Kuber" },
            { hi: "यमराज", en: "Yamraj" },
            { hi: "कार्तिकेय", en: "Kartikeya" },
            { hi: "विश्वकर्मा", en: "Vishwakarma" },
            { hi: "धनवंतरी", en: "Dhanvantari" },
            { hi: "माता दुर्गा", en: "Mata Durga" },
            { hi: "माता लक्ष्मी", en: "Mata Lakshmi" },
            { hi: "माता सरस्वती", en: "Mata Saraswati" },
            { hi: "माता काली", en: "Mata Kali" },
            { hi: "माता सीता", en: "Mata Sita" },
            { hi: "माता पार्वती", en: "Mata Parvati" },
            { hi: "माता राधा", en: "Mata Radha" },
            { hi: "माता गंगा", en: "Mata Ganga" },
            { hi: "माता गायत्री", en: "Mata Gayatri" },
            { hi: "माता अन्नपूर्णा", en: "Mata Annapurna" },
            { hi: "माता संतोषी", en: "Mata Santoshi" },
            { hi: "माता तुलसी", en: "Mata Tulsi" }
        ];

        let targetDeity = {};

        // रैंडम देवता चुनने का फंक्शन जो हिंदी और इंग्लिश दोनों नाम स्क्रीन पर दिखाएगा
        function setRandomDeityPrompt() {
            const randomIndex = Math.floor(Math.random() * deities.length);
            targetDeity = deities[randomIndex];
            
            const instructionElement = document.getElementById('auth-instruction');
            if (instructionElement) {
                // यहाँ हिंदी और अंग्रेजी दोनों साफ दिखेंगे ताकि किसी भी देश का यूजर आसानी से पढ़ सके
                instructionElement.innerHTML = `Say / बोलें:<br><span style="font-size: 18px; color: #4ade80;">${targetDeity.hi} / ${targetDeity.en}</span>`;
            }
        }

        // वॉइस ऑथेंटिकेशन और लेजर डेटाबेस लॉगिंग
        function startVoiceAuthentication() {
            setRandomDeityPrompt();

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser does not support Speech Recognition. Please use Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            // भाषा को 'hi-IN' या 'en-US' दोनों के लिए लचीला बनाया गया है ताकि हिंदी और अंग्रेजी दोनों आवाजें डिटेक्ट हो सकें
            recognition.lang = 'hi-IN'; 
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim().toLowerCase();
                const hindiName = targetDeity.hi.toLowerCase();
                const englishName = targetDeity.en.toLowerCase();

                // चेक करेगा कि यूजर ने हिंदी या अंग्रेजी, दोनों में से कोई भी सही उच्चारण किया या नहीं
                if (spokenText.includes(hindiName) || spokenText.includes(englishName)) {
                    alert(`Success! Authentication Passed. You spoke: '${targetDeity.en}'`);
                    saveToLedger(targetDeity.hi + " / " + targetDeity.en, "SUCCESS");
                } else {
                    alert(`Failed! Expected: '${targetDeity.en} (${targetDeity.hi})'. Please try again.`);
                    saveToLedger(targetDeity.hi + " / " + targetDeity.en, "FAILED");
                    setRandomDeityPrompt();
                }
            };

            recognition.onerror = function(event) {
                console.error("Speech Recognition Error:", event.error);
            };

            recognition.start();
        }

        // लेजर डेटाबेस लॉग में एंट्री सेव करने का फंक्शन
        function saveToLedger(deityName, status) {
            const ledgerEntry = {
                timestamp: new Date().toLocaleString(),
                verifiedDeity: deityName,
                authenticationStatus: status,
                device: navigator.userAgent
            };

            let existingLedger = JSON.parse(localStorage.getItem('aura_crypt_ledger') || '[]');
            existingLedger.push(ledgerEntry);
            localStorage.setItem('aura_crypt_ledger', JSON.stringify(existingLedger));

            document.getElementById('ledger-status').innerText = `Ledger Log Updated: ${status} (${deityName})`;
        }

        // कैमरा सेटअप
        async function setupCamera() {
            try {
                const videoElement = document.getElementById('videoElement');
                const cameraSelect = document.getElementById('cameraSelect');
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                cameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });

                if (videoDevices.length > 0) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: videoDevices[0].deviceId }
                    });
                    videoElement.srcObject = stream;
                }
            } catch (err) {
                console.error("Camera access error:", err);
            }
        }

        setupCamera();
    </script>
</body>
</html>
