<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑरक्रिप्ट बायोमेट्रिक सुरक्षा</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* मुख्य स्क्रीन (कैमरा और वॉइस कमांड वाला हिस्सा) */
        .main-container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* पॉप-अप मोडल ओवरले */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: left;
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 18px;
            color: #38bdf8;
        }

        #langSearch {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .language-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .language-list label {
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
            background: #334155;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .language-list label:hover {
            background: #475569;
        }

        #okButton {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #okButton:hover {
            background: #1d4ed8;
        }

        .options-box {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- भाषा चयन पॉप-अप (Modal) -->
    <div id="languageModal" class="modal-overlay">
        <div class="modal-content">
            <h3>🔍 Search & Select Language / भाषा खोजें:</h3>
            <input type="text" id="langSearch" placeholder="Type to search language..." onkeyup="filterLanguages()">
            
            <div id="langList" class="language-list">
                <label><input type="radio" name="language" value="en" checked> English</label>
                <label><input type="radio" name="language" value="hi"> हिन्दी (Hindi)</label>
                <label><input type="radio" name="language" value="gu"> ગુજરાતી (Gujarati)</label>
                <label><input type="radio" name="language" value="fr"> Français (French)</label>
                <label><input type="radio" name="language" value="es"> Español (Spanish)</label>
                <label><input type="radio" name="language" value="ar"> العربية (Arabic)</label>
                <label><input type="radio" name="language" value="de"> Deutsch (German)</label>
            </div>

            <!-- OK बटन जो पॉप-अप को बंद करके पीछे का पेज दिखाएगा -->
            <button type="button" id="okButton" onclick="closeLanguageModal()">OK</button>
        </div>
    </div>

    <!-- मुख्य स्क्रीन (कैमरा और वॉइस कमांड) -->
    <div class="main-container">
        <h2>ऑरक्रिप्ट बायोमेट्रिक सुरक्षा में आपका स्वागत है</h2>
        <p>कृपया अपने IR कैमरे या वॉइस कमांड का उपयोग करके प्रमाणीकरण करें।</p>
        
        <div class="options-box">
            <button class="action-btn">📷 कैमरा शुरू करें</button>
            <button class="action-btn">🎙️ वॉइस कमांड</button>
        </div>
    </div>

    <script>
        // OK बटन पर क्लिक करने पर चलने वाला फंक्शन
        function closeLanguageModal() {
            // चुनी गई भाषा का मान प्राप्त करें
            const selectedLang = document.querySelector('input[name="language"]:checked').value;
            console.log("चयनित भाषा:", selectedLang);

            // पॉप-अप बॉक्स को स्क्रीन से पूरी तरह छुपा दें
            document.getElementById('languageModal').style.display = 'none';
        }

        // भाषाओं को सर्च/फिल्टर करने का फंक्शन
        function filterLanguages() {
            let input = document.getElementById('langSearch').value.toLowerCase();
            let labels = document.getElementById('langList').getElementsByTagName('label');
            
            for (let i = 0; i < labels.length; i++) {
                let txt = labels[i].textContent || labels[i].innerText;
                if (txt.toLowerCase().indexOf(input) > -1) {
                    labels[i].style.display = "";
                } else {
                    labels[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
