<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Crypt - Security Checkpoint</title>
    <!-- MediaPipe Face Mesh CDN for Client-Side Eye/Iris Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #131b2e;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { font-size: 20px; margin-bottom: 15px; color: #00ffcc; }
        .checkpoint-box {
            background: #1a233a;
            border: 1px solid #22c55e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            background-color: #22c55e;
            color: #000;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            text-align: center;
        }
        .btn:hover { background-color: #16a34a; color: #fff; }
        select, video {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: #0b0f19;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 6px;
        }
        video { height: 220px; object-fit: cover; display: none; }
        .hidden { display: none; }
        #voiceStatus { margin-top: 10px; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <!-- स्क्रीन 1: चेकपॉइंट डैशबोर्ड -->
        <div id="checkpoint-screen">
            <h2>Security Checkpoint</h2>
            <div class="checkpoint-box">✓ Iris & Biometric Sensor Scan</div>
            <div class="checkpoint-box">✓ 3D Portable Area Space Mapping</div>
            <div class="checkpoint-box">✓ Voice Authentication & Location Match</div>
            
            <button class="btn" id="secureActiveBtn">SYSTEM SECURED & ACTIVE</button>
        </div>

        <!-- स्क्रीन 2: कैमरा सिलेक्शन और आई-स्कैनिंग -->
        <div id="scanner-screen" class="hidden">
            <h2>Camera & Biometric Scan</h2>
            <label for="cameraSelect">कैमरा चुनें (Mobile/Desktop/IR):</label>
            <select id="cameraSelect">
                <option value="">कैमरा लोड हो रहा है...</option>
            </select>

            <video id="webcamVideo" autoplay playsinline></video>

            <button class="btn" id="startVoiceBtn" style="margin-top: 15px; background-color: #38bdf8;">वॉइस ऑथेंटिकेशन शुरू करें</button>
            <p id="voiceStatus">पासफ्रेज़: 33 कोटि देवताओं में से नाम बोलें</p>

            <button class="btn hidden" id="paymentBtn" style="background-color: #f59e0b;">भुगतान (Payment) पर आगे बढ़ें</button>
        </div>
    </div>

    <script>
        const secureActiveBtn = document.getElementById('secureActiveBtn');
        const checkpointScreen = document.getElementById('checkpoint-screen');
        const scannerScreen = document.getElementById('scanner-screen');
        const cameraSelect = document.getElementById('cameraSelect');
        const webcamVideo = document.getElementById('webcamVideo');
        const startVoiceBtn = document.getElementById('startVoiceBtn');
        const voiceStatus = document.getElementById('voiceStatus');
        const paymentBtn = document.getElementById('paymentBtn');

        // स्टेप 1: बटन क्लिक पर स्क्रीन बदलना और हार्डवेयर इनिशियलाइज करना
        secureActiveBtn.addEventListener('click', async () => {
            checkpointScreen.classList.add('hidden');
            scannerScreen.classList.remove('hidden');
            webcamVideo.style.display = 'block';
            await initHardwareAndCameras();
        });

        // स्टेप 2: नेविगेटर मीडिया डिवाइस से कैमरा और माइक परमिशन व लिस्ट फेच करना
        async function initHardwareAndCameras() {
            try {
                // परमिशन मांगें
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                webcamVideo.srcObject = stream;

                // उपलब्ध कैमरों की लिस्ट ड्रॉपडाउन में भरना
                const devices = await navigator.mediaDevices.enumerateDevices();
                cameraSelect.innerHTML = "";
                
                devices.forEach((device, index) => {
                    if (device.kind === 'videoinput') {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Camera Device ${index + 1}`;
                        cameraSelect.appendChild(option);
                    }
                });
            } catch (err) {
                console.error("हार्डवेयर एरर:", err);
                alert("कैमरा और माइक्रोफ़ोन की अनुमति अनिवार्य है। कृपया परमिशन दें।");
            }
        }

        // ड्रॉपडाउन बदलने पर दूसरा कैमरा स्विच करने के लिए
        cameraSelect.addEventListener('change', async () => {
            const deviceId = cameraSelect.value;
            const constraints = {
                video: { deviceId: { exact: deviceId } }
            };
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                webcamVideo.srcObject = stream;
            } catch (e) {
                console.error("कैमरा स्विच करने में त्रुटि:", e);
            }
        });

        // स्टेप 3: हिंदी स्पीच रिकग्निशन और 33 कोटि देवता वॉइस ऑथेंटिकेशन
        startVoiceBtn.addEventListener('click', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("आपका ब्राउज़र स्पीच रिकग्निशन सपोर्ट नहीं करता। क्रोम ब्राउज़र इस्तेमाल करें।");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; // हिंदी भाषा सेट
            recognition.interimResults = false;

            voiceStatus.innerText = "सुन रहे हैं... कृपया 33 कोटि देवताओं में से कोई नाम बोलें...";
            voiceStatus.style.color = "#facc15";

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim();
                console.log("बोला गया टेक्स्ट:", spokenText);

                // 33 कोटि देवताओं या सुरक्षित पासफ्रेज़ की सूची
                const deitiesList = ["ब्रह्मा", "विष्णु", "शिव", "इंद्र", "अग्नि", "वरुण", "सूर्य", "चंद्रमा", "गणेश", "हनुमान", "माता"];

                const isMatched = deitiesList.some(deity => spokenText.toLowerCase().includes(deity.toLowerCase()));

                if (isMatched) {
                    voiceStatus.innerText = `सफलतापूर्वक ऑथेंटिकेट हुआ: "${spokenText}" ✓`;
                    voiceStatus.style.color = "#22c55e";
                    startVoiceBtn.classList.add('hidden');
                    paymentBtn.classList.remove('hidden'); // पेमेंट बटन दिखाना
                } else {
                    voiceStatus.innerText = `मैच नहीं हुआ ("${spokenText}"). फिर से बोलें।`;
                    voiceStatus.style.color = "#ef4444";
                }
            };

            recognition.onerror = (e) => {
                voiceStatus.innerText = "वॉइस रिकग्निशन में त्रुटि आई। पुनः प्रयास करें।";
                voiceStatus.style.color = "#ef4444";
            };

            recognition.start();
        });

        // स्टेप 4: पेमेंट गेटवे पर आगे बढ़ना
        paymentBtn.addEventListener('click', () => {
            alert("बायोमेट्रिक और वॉइस ऑथेंटिकेशन पूर्ण! अब पेमेंट गेटवे की प्रक्रिया शुरू हो रही है।");
            // यहाँ आप अपना Razorpay या पेमेंट लिंक जोड़ सकते हैं
        });
    </script>
</body>
</html>
