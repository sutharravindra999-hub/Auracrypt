          { display: "जय श्री विश्वकर्मा भगवान", keywords: ["जय श्री विश्वकर्मा", "जय विश्वकर्मा भगवान", "जय विश्वकर्मा जी", "jai shri vishwakarma", "jai vishwakarma"] },
          { display: "जय श्री कुबेर जी / जय श्री चित्रगुप्त जी / जय यमराज जी", keywords: ["जय श्री कुबेर", "जय कुबेर जी", "जय श्री चित्रगुप्त", "जय धर्मराज", "jai kuber ji", "jai chitragupta"] },
          { display: "जय श्री काल भैरव / जय बटुक भैरव नाथ", keywords: ["जय काल भैरव", "जय श्री भैरव नाथ", "जय बटुक भैरव", "jai kaal bhairav", "jai bhairav nath"] },

          // 8. लोक देवता, संत एवं कुलदेवता
          { display: "जय बाबा रामदेव जी / जय तेजाजी / जय गोगाजी / जय पाबूजी", keywords: ["जय बाबा रामदेव", "जय रामदेव पीर", "जय तेजाजी महाराज", "जय गोगाजी महाराज", "जय पाबूजी", "जय देवनारायण भगवान", "jai baba ramdev", "jai tejaji", "jai gogaji", "devnarayan"] },
          { display: "जय श्री गुरुदेव / जय कुलदेवता / जय पितृ देव", keywords: ["जय गुरुदेव", "जय श्री गुरुदेव", "जय कुलदेवता", "जय पितृ देव", "जय ग्राम देवता", "jai gurudev", "jai pitru dev", "jai kuldevta"] }
        ];

        function normalizeSpeechText(text) {
          return text
            .toLowerCase()
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()।?]/g, "")
            .replace(/shree/g, "shri")
            .replace(/jay/g, "jai")
            .replace(/जै/g, "जय")
            .replace(/स्री/g, "श्री")
            .replace(/माताजी/g, "माता जी")
            .replace(/भगवानजी/g, "भगवान जी")
            .replace(/\s+/g, " ")
            .trim();
        }

        function verifySanatanVoiceAuth(spokenText) {
          if (!spokenText) return { isAuthenticated: false, matchedName: null };
          const cleanedSpeech = normalizeSpeechText(spokenText);

          for (const deity of SANATAN_VOICE_PASSWORDS) {
            for (const keyword of deity.keywords) {
              const cleanKeyword = normalizeSpeechText(keyword);
              if (cleanedSpeech.includes(cleanKeyword)) {
                return { isAuthenticated: true, matchedName: deity.display };
              }
            }
          }
          return { isAuthenticated: false, matchedName: null };
        }

        function initSanatanVoiceAuthentication() {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            document.getElementById("auth-status").innerText = "आपका ब्राउज़र वॉइस रिकग्निशन सपोर्ट नहीं करता।";
            return;
          }

          const recognition = new SpeechRecognition();
          recognition.lang = "hi-IN";
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.maxAlternatives = 5;

          const statusElement = document.getElementById("auth-status");
          const promptElement = document.getElementById("voice-prompt");

          promptElement.innerText = "मािक चालू है... किसी भी देवी-देवता का जयकारा बोलें";

          recognition.onstart = () => {
            statusElement.innerText = "🎙️ सुन रहा हूँ... कृपया बोलें...";
            statusElement.style.color = "#ffffff";
          };

          recognition.onresult = (event) => {
            let authResult = { isAuthenticated: false, matchedName: null };
            let bestTranscript = event.results[0][0].transcript;

            for (let i = 0; i < event.results[0].length; i++) {
              const alternativeText = event.results[0][i].transcript;
              const check = verifySanatanVoiceAuth(alternativeText);
              if (check.isAuthenticated) {
                authResult = check;
                break;
              }
            }

            if (authResult.isAuthenticated) {
              statusElement.innerHTML = `✅ ऑथेंटिकेशन सफल!<br><span style="color: #4ade80;">(${authResult.matchedName})</span>`;
              statusElement.style.background = "#064e3b";
            } else {
              statusElement.innerHTML = `❌ सुना गया: "${bestTranscript}"<br>पहचान नहीं हुई, पुनः बोलें...`;
              statusElement.style.background = "#7f1d1d";
              setTimeout(() => {
                try { recognition.start(); } catch (e) {}
              }, 1500);
            }
          };

          recognition.onerror = (event) => {
            if (event.error === "no-speech" || event.error === "aborted") {
              setTimeout(() => {
                try { recognition.start(); } catch (e) {}
              }, 1000);
            } else {
              statusElement.innerText = `⚠️ माइक त्रुटि: ${event.error}`;
            }
          };

          try {
            recognition.start();
          } catch (err) {
            console.log("Waiting for user interaction:", err);
          }
        }

        window.addEventListener("DOMContentLoaded", () => {
          initSanatanVoiceAuthentication();
        });
    </script>
